<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خطتي</title>
<meta name="theme-color" content="#5b3fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--p:#5b3fd1;--y:#ffc94d;--bg:#f4f1ff;--card:#fff;--fg:#221c3d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
header{background:var(--p);color:#fff;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));text-align:center}
header h1{font-size:24px}header p{font-size:14px;opacity:.85}
main{max-width:620px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:12px;border:1px solid #d6cffa;border-radius:12px;font-size:17px;font-family:inherit;margin-bottom:8px;background:#fff;color:var(--fg)}
.row{display:flex;gap:8px}.row>*{flex:1}
.days{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.days label{flex:1;min-width:40px;text-align:center;background:#ece8ff;border-radius:10px;padding:8px 0;font-size:14px;cursor:pointer}
.days input{display:none}.days input:checked+span{background:var(--p);color:#fff}
.days span{display:block;border-radius:10px;padding:8px 0}.days label{padding:0;background:none}
button{font-family:inherit;border:0;border-radius:12px;font-size:17px;padding:12px;cursor:pointer;background:var(--p);color:#fff;width:100%}
.t{display:flex;align-items:center;gap:10px}
.t .tm{background:var(--y);color:#3b2b00;font-weight:700;border-radius:10px;padding:6px 10px;font-size:18px;direction:ltr}
.t .nm{flex:1;font-size:18px}.t small{display:block;color:#7a72a8;font-size:12px}
.t .x{width:auto;background:#ffe3e3;color:#b00020;padding:6px 12px;font-size:15px}
.t.done .nm{text-decoration:line-through;opacity:.5}
#st{font-size:14px;margin-bottom:10px;padding:10px;border-radius:12px;background:#fff3cd}
#st.ok{background:#d9f7e6}
#ring{position:fixed;inset:0;background:#5b3fd1ee;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;z-index:9;padding:20px}
#ring h2{font-size:30px}#ring button{background:var(--y);color:#3b2b00;width:auto;padding:12px 40px}
.empty{text-align:center;color:#8f88b8;padding:20px}
</style>
</head>
<body>
<header><h1>📋 خطتي</h1><p>اكتب مهامك ووقتها، وهنبهك لما يجي الوقت</p></header>
<main>
<div id="st"></div>
<div class="card">
<input id="name" placeholder="هتعمل إيه؟ (مثلاً: مذاكرة التوثيق)">
<div class="row"><input id="time" type="time" value="09:00"><select id="rep"><option value="d">كل يوم</option><option value="o">مرة واحدة (النهاردة أو بكرة)</option><option value="w">أيام معينة</option></select></div>
<div id="days" class="days" style="display:none"></div>
<button id="add">إضافة للخطة</button>
</div>
<div id="list"></div>
<p class="empty" style="font-size:12px">التنبيه بيشتغل والتطبيق مفتوح أو شغال في الخلفية. للتأكد افتح التطبيق قبل المواعيد المهمة.</p>
</main>
<div id="ring"><div style="font-size:60px">⏰</div><h2 id="rt"></h2><div id="rs"></div><button id="rok">تمام</button></div>
<script>
const $=id=>document.getElementById(id);
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let T=JSON.parse(localStorage.getItem('plan')||'[]');
const save=()=>localStorage.setItem('plan',JSON.stringify(T));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('days').innerHTML=DN.map((n,i)=>'<label><input type="checkbox" value="'+i+'"><span>'+n.slice(0,3)+'</span></label>').join('');
$('rep').onchange=()=>$('days').style.display=$('rep').value==='w'?'flex':'none';
function desc(t){return t.rep==='d'?'كل يوم':t.rep==='o'?'مرة واحدة · '+t.date:t.days.map(i=>DN[i]).join('، ')}
function render(){const l=$('list');if(!T.length){l.innerHTML='<p class="empty">مفيش مهام لسه. ضيف أول مهمة 👆</p>';return}
const s=[...T].sort((a,b)=>a.time.localeCompare(b.time));
l.innerHTML=s.map(t=>'<div class="card t'+(t.done===today()?' done':'')+'"><div class="tm">'+t.time+'</div><div class="nm">'+t.name.replace(/</g,'&lt;')+'<small>'+desc(t)+'</small></div><button class="x" data-id="'+t.id+'">حذف</button></div>').join('');
l.querySelectorAll('.x').forEach(b=>b.onclick=()=>{T=T.filter(x=>x.id!=b.dataset.id);save();render()})}
$('add').onclick=async()=>{const name=$('name').value.trim();if(!name){$('name').focus();return}
const t={id:Date.now(),name,time:$('time').value,rep:$('rep').value,last:''};
if(t.rep==='w'){t.days=[...document.querySelectorAll('#days input:checked')].map(x=>+x.value);if(!t.days.length)return alert('اختار يوم واحد على الأقل')}
if(t.rep==='o'){const n=new Date(),[h,m]=t.time.split(':');const d=new Date();d.setHours(+h,+m,0,0);if(d<n)d.setDate(d.getDate()+1);t.date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
T.push(t);save();$('name').value='';render();await ask()};
async function ask(){if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();status()}
function status(){const s=$('st');if(!('Notification' in window)){s.textContent='المتصفح ده مش بيدعم الإشعارات. هيظهرلك تنبيه جوه التطبيق بس.';return}
if(Notification.permission==='granted'){s.className='ok';s.textContent='✅ الإشعارات شغالة'}else if(Notification.permission==='denied'){s.textContent='⚠️ الإشعارات مقفولة. فعّلها من إعدادات المتصفح للتطبيق.'}else{s.innerHTML='🔔 دوس هنا عشان تفعّل الإشعارات';s.style.cursor='pointer';s.onclick=ask}}
async function fire(t){$('rt').textContent='دلوقتي وقت: '+t.name;$('rs').textContent=t.time;$('ring').style.display='flex';
if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);
try{if(Notification.permission==='granted'){const r=await navigator.serviceWorker.ready;r.showNotification('⏰ خطتي: '+t.name,{body:'جه وقتها ('+t.time+')',icon:'icon.svg',tag:'p'+t.id,vibrate:[300,150,300],requireInteraction:true})}}catch(e){}}
$('rok').onclick=()=>$('ring').style.display='none';
function tick(){const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),td=today();let ch=false;
T.forEach(t=>{if(t.time>hm||t.last===td+t.time)return;
const ok=t.rep==='d'||(t.rep==='w'&&t.days.includes(n.getDay()))||(t.rep==='o'&&t.date===td);
// fire if within 10 min window (covers app resumed shortly after)
const [h,m]=t.time.split(':');const diff=(n.getHours()*60+n.getMinutes())-(+h*60+ +m);
if(ok&&diff<=10){t.last=td+t.time;t.done=td;ch=true;fire(t)}else if(ok&&diff>10&&t.last!==td+t.time){t.last=td+t.time}});
if(ch){T=T.filter(t=>!(t.rep==='o'&&t.last&&t.date<td));save();render()}}
setInterval(tick,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();status();tick();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
